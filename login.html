<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Přihlášení — majlajf</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(0,229,255,.10), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(255,0,255,.10), transparent 60%),
      #070b14;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#e9eefb; }
  .card { width:min(94vw,400px); padding:28px 26px; border-radius:20px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 24px 70px rgba(0,0,0,.45); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .brand b { font-size:17px; letter-spacing:-.02em; }
  .brand b span { color:#39ff14; }
  .dot { width:9px; height:9px; border-radius:99px; background:#00e5ff; box-shadow:0 0 12px #00e5ff; }
  h1 { font-size:18px; margin:0 0 6px; }
  p.sub { font-size:12.5px; line-height:1.55; color:#93a4c4; margin:0 0 18px; }
  label { display:block; font-size:12px; color:#a9b8d4; margin-bottom:6px; }
  input[type=password] { width:100%; padding:12px 13px; border-radius:12px; font-size:14px;
    border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.3); color:#fff; }
  input[type=password]:focus { outline:none; border-color:#00e5ff; box-shadow:0 0 0 3px rgba(0,229,255,.16); }
  button { width:100%; margin-top:14px; padding:12px; border:0; border-radius:12px; cursor:pointer;
    font-weight:700; font-size:14px; color:#06131a;
    background:linear-gradient(180deg,#5ef7ff,#00c8e0); }
  button:hover { filter:brightness(1.07); }
  .err { margin-top:14px; font-size:12.5px; color:#ff8f8f; }
  .note { margin-top:18px; font-size:11px; line-height:1.5; color:#6f7f9c; }
  .back { display:inline-block; margin-top:14px; font-size:11.5px; color:#93a4c4; text-decoration:none; }
  .back:hover { color:#fff; }
</style>
</head>
<body>
  <form class="card" method="POST" action="/api/login" id="f">
    <div class="brand"><span class="dot"></span><b>majlajf<span>.</span></b></div>
    <h1>Přihlášení</h1>
    <p class="sub">Tahle stránka je soukromý rozcestník k interním věcem. Zadej heslo — zůstaneš přihlášený 90 dní, takže se to pořád neptá.</p>
    <input type="hidden" name="next" id="nextField" value="/">
    <label for="pw">Heslo</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Přihlásit se</button>
    <div class="err" id="err" style="display:none">Nesprávné heslo, zkus to znovu.</div>
    <div class="note">Pokud heslo nevíš, uloženo je na Macu: <code>~/_config/panel-heslo.txt</code> (změna: <code>python3 ~/dev/ads-panel/set-password.py</code>).</div>
  </form>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get('e')) document.getElementById('err').style.display = 'block';
      var next = p.get('next') || '/';
      if (next.indexOf('/') === 0) document.getElementById('nextField').value = next;
    })();
  </script>
</body>
</html>
